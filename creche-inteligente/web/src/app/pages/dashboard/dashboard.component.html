<div class="page">
  <div class="page-header">
    <h1>Dashboard</h1>
    <div class="filtros">
      <mat-form-field appearance="outline" class="filtro">
        <mat-label>Ano</mat-label>
        <mat-select [(ngModel)]="anoSelecionado" (selectionChange)="carregar()">
          <mat-option *ngFor="let ano of anos" [value]="ano">{{ ano }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filtro">
        <mat-label>CRE</mat-label>
        <mat-select [(ngModel)]="creSelecionada" (selectionChange)="carregar()">
          <mat-option value="">Todas</mat-option>
          <mat-option *ngFor="let cre of cres" [value]="cre">{{ cre }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <p class="aviso" *ngIf="erro()">
    Exibindo dados de demonstração — a API do dashboard ainda não respondeu.
  </p>

  <div class="loading" *ngIf="carregando()">
    <mat-spinner diameter="32"></mat-spinner>
  </div>

  <ng-container *ngIf="!carregando() && kpis() as k">
    <div class="kpis">
      <app-kpi-card label="Total de inscrições" [value]="k.total_inscricoes" icon="assignment"></app-kpi-card>
      <app-kpi-card
        label="% em lista de espera"
        [value]="(k.pct_lista_espera * 100).toFixed(0) + '%'"
        icon="hourglass_top"
      ></app-kpi-card>
      <app-kpi-card
        label="% confirmado"
        [value]="(k.pct_confirmado * 100).toFixed(0) + '%'"
        icon="check_circle"
      ></app-kpi-card>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h2>Série histórica (2021–2025)</h2>
        <div class="chart-wrap">
          <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" type="line"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <h2>Top unidades por descompasso (fila × vagas)</h2>
        <div class="chart-wrap">
          <canvas baseChart [data]="barChartData" [options]="barChartOptions" type="bar"></canvas>
        </div>
      </div>
    </div>
  </ng-container>
</div>
