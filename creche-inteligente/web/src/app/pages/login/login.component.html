<div class="login-page">
  <mat-card class="login-card">
    <div class="login-header">
      <mat-icon class="brand-icon">child_care</mat-icon>
      <h1>Creche Inteligente</h1>
      <p>Prefeitura do Rio de Janeiro · Secretaria Municipal de Educação</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="entrar()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="current-password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <p class="erro" *ngIf="erro()">{{ erro() }}</p>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="full-width entrar-btn"
        [disabled]="carregando()"
      >
        <mat-spinner *ngIf="carregando()" diameter="20" class="spinner"></mat-spinner>
        <span *ngIf="!carregando()">Entrar</span>
      </button>
    </form>
  </mat-card>
</div>
