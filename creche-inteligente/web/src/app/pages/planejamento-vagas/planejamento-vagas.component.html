<div class="page">
  <div class="page-header">
    <h1>Planejamento de Vagas</h1>
    <button mat-flat-button color="primary" routerLink="/planejamento-vagas/novo">
      <mat-icon>add</mat-icon>
      Novo planejamento
    </button>
  </div>

  <div class="table-card">
    <div class="loading" *ngIf="carregando()"><mat-spinner diameter="28"></mat-spinner></div>

    <table mat-table [dataSource]="itens()" *ngIf="!carregando()">
      <ng-container matColumnDef="ano">
        <th mat-header-cell *matHeaderCellDef>Ano</th>
        <td mat-cell *matCellDef="let i">{{ i.ano }}</td>
      </ng-container>
      <ng-container matColumnDef="codigo_unidade">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let i">{{ i.codigo_unidade }}</td>
      </ng-container>
      <ng-container matColumnDef="nome_unidade">
        <th mat-header-cell *matHeaderCellDef>Unidade</th>
        <td mat-cell *matCellDef="let i">{{ i.nome_unidade || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="grupamento">
        <th mat-header-cell *matHeaderCellDef>Grupamento</th>
        <td mat-cell *matCellDef="let i">{{ i.grupamento }}</td>
      </ng-container>
      <ng-container matColumnDef="turno">
        <th mat-header-cell *matHeaderCellDef>Turno</th>
        <td mat-cell *matCellDef="let i">{{ i.turno }}</td>
      </ng-container>
      <ng-container matColumnDef="vagas_planejadas">
        <th mat-header-cell *matHeaderCellDef>Vagas planejadas</th>
        <td mat-cell *matCellDef="let i">{{ i.vagas_planejadas }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let i">
          <button mat-icon-button [routerLink]="['/planejamento-vagas', i.id_planejamento, 'editar']" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="remover(i)" title="Remover">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    <p class="vazio" *ngIf="!carregando() && itens().length === 0">Nenhum planejamento cadastrado ainda.</p>
  </div>
</div>
